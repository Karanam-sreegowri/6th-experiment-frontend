<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1> Student Result Management System</h1>
            <p>Enter Student Details and Marks to Get the Result</p>
        </div>
        <div class="form-box">
            <form id="resultForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Student Name:</label>
                        <input type="text" id="name" placeholder="Enter student name" required>
                    </div>
                    <div class="form-group">
                        <label>Roll Number:</label>
                        <input type="text" id="roll" placeholder="Enter roll number" required>
                    </div>
                    <div class="form-group">
                        <label>Mathematics Marks:</label>
                        <input type="number" id="mark1" min="0" max="100"
                               placeholder="Enter marks " required>
                    </div>
                    <div class="form-group">
                        <label>Artificial Intelligence and Machine Learning Marks:</label>
                        <input type="number" id="mark2" min="0" max="100"
                               placeholder="Enter marks " required>
                    </div>
                    <div class="form-group">
                        <label>Operating System Marks:</label>
                        <input type="number" id="mark3" min="0" max="100"
                               placeholder="Enter marks " required>
                    </div>
                    <div class="form-group">
                        <label>Object Oriented Programming using Java Marks:</label>
                        <input type="number" id="mark4" min="0" max="100"
                               placeholder="Enter marks " required>
                    </div>
                    <div class="form-group">
                        <label>Frontend Development Marks:</label>
                        <input type="number" id="mark5" min="0" max="100"
                               placeholder="Enter marks " required>
                    </div>
                    <div class="form-group">
                        <label>Embedded System of IoT Marks:</label>
                        <input type="number" id="mark6" min="0" max="100"
                               placeholder="Enter marks " required>
                    </div>
                </div>
                <div class="buttons">
                    <button type="submit" class="calculate">
                         Calculate Result
                    </button>
                    <button type="reset" class="clear">
                         Clear
                    </button>
                </div>
            </form>
            <div id="result"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
